#:schema node_modules/wrangler/config-schema.json
name = "unifi-protect-assistant"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
TIMEZONE = "America/New_York"
TARGET_PERSON_NAMES = ""
TARGET_PERSON_IDS = ""
WATCH_CAMERA_IDS = ""
# ALLOWED_EMAILS is a Worker secret (synced from GitHub Actions on deploy)
# CF_ACCESS_TEAM_DOMAIN / CF_ACCESS_AUD are Worker secrets (set after Access provisioning)

PRESENCE_GAP_MINUTES = "20"
PRESENCE_GAP_BY_PERSON = ""
PRESENCE_GAP_BY_CAMERA = ""

# Vehicle/license-plate ingestion is experimental and off by default.
ENABLE_VEHICLE_EVENTS = "true"
# Never set ALLOW_INSECURE_WEBHOOKS or ALLOW_LOCAL_AUTH_BYPASS in production.
ALLOW_INSECURE_WEBHOOKS = "false"
MAX_WEBHOOK_BODY_BYTES = "2097152"

[[d1_databases]]
binding = "DB"
database_name = "unifi_protect_db"
database_id = "605b47aa-684c-425b-8eac-ce8f508a7cdd"

[[kv_namespaces]]
binding = "KV"
id = "c66e834e4d7b484cb5eef270ee92493e"

[triggers]
crons = ["0 6 * * *"] # 6:00 AM UTC ≈ 2:00 AM ET

# Static CSS/JS served before the Worker when the path matches (no run_worker_first).
[assets]
directory = "./public"
