name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-deploy
          path: coverage/
          if-no-files-found: error

      - name: Wrangler dry-run build
        run: npx wrangler deploy --dry-run

      - name: Apply all migrations to a fresh local D1 database
        run: npm run db:migrate:local

      - name: Populated-schema upgrade and foreign-key integrity
        run: npx vitest run tests/retention.integration.test.ts tests/betterAuthRemoval.integration.test.ts

  deploy:
    name: deploy
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      SMOKE_BASE_URL: https://unifi-protect-assistant.mrcoffee.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Deploy publishes the Worker; disable setup-node caching to avoid cache-poisoning risk.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate ALLOWED_EMAILS
        run: |
          set +x
          node -e "
            import { parseAllowedEmailsStrict } from './shared/allowedEmails.mjs';
            const r = parseAllowedEmailsStrict(process.env.ALLOWED_EMAILS);
            console.log('allowlist_count=' + r.count);
          "

      - name: Provision Cloudflare Access from ALLOWED_EMAILS
        id: access
        run: |
          set +x
          node scripts/configure-cloudflare-access.mjs | tee /tmp/access-configure.out
          AUD="$(sed -n 's/^CF_ACCESS_AUD=//p' /tmp/access-configure.out | tail -1)"
          TEAM="$(sed -n 's/^team_domain=//p' /tmp/access-configure.out | tail -1)"
          if [[ -z "${AUD}" || -z "${TEAM}" ]]; then
            echo "::error::Access provisioning did not emit CF_ACCESS_AUD / team_domain"
            exit 1
          fi
          echo "aud=${AUD}" >> "$GITHUB_OUTPUT"
          echo "team_domain=${TEAM}" >> "$GITHUB_OUTPUT"

      - name: Verify Access provisioning is idempotent
        env:
          ACCESS_AUD: ${{ steps.access.outputs.aud }}
        run: |
          set +x
          node scripts/configure-cloudflare-access.mjs | tee /tmp/access-configure-2.out
          grep -qi 'no-op\|unchanged\|already in sync\|idempotent' /tmp/access-configure-2.out || \
            grep -q "CF_ACCESS_AUD=${ACCESS_AUD}" /tmp/access-configure-2.out

      - name: Apply D1 migrations (remote)
        id: migrate
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            WEBHOOK_SECRET
            ALLOWED_EMAILS
            CF_ACCESS_TEAM_DOMAIN
            CF_ACCESS_AUD
            HONEYBADGER_API_KEY
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ steps.access.outputs.team_domain }}
          CF_ACCESS_AUD: ${{ steps.access.outputs.aud }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}

      - name: Smoke test
        id: smoke
        run: bash scripts/smoke.sh

      - name: Rollback Worker on smoke failure
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          npx wrangler rollback --yes --message "Automated rollback: smoke test failed after ${GITHUB_SHA}"

      - name: Distinguish migration vs deploy failure
        if: failure()
        run: |
          if [[ "${{ steps.access.outcome }}" != "success" ]]; then
            echo "::error::Cloudflare Access provisioning failed — Worker was not deployed."
            exit 1
          fi
          if [[ "${{ steps.migrate.outcome }}" != "success" ]]; then
            echo "::error::D1 migration failed — Worker was not deployed. Access remains enabled."
            exit 1
          fi
          if [[ "${{ steps.deploy.outcome }}" != "success" ]]; then
            echo "::error::Worker deploy failed after migrations applied. Access remains enabled."
            exit 1
          fi
          echo "::error::Post-deploy smoke or rollback step failed. Access remains enabled."
          exit 1
