name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_BASE_URL: https://unifi-protect-assistant.mrcoffee.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      # Additive migrations only in the same release as Worker code that needs them.
      # For destructive schema changes, use expand → migrate → contract across releases.
      # Non-interactive CI skips the apply confirmation; a D1 backup is still captured.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Plain [vars] come from wrangler.toml on deploy.
          # These Worker secrets are created/replaced from GitHub Actions secrets.
          secrets: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_API_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            ALLOWED_EMAILS
            HONEYBADGER_API_KEY
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}

      - name: Smoke test
        id: smoke
        run: bash scripts/smoke.sh

      # Rolls back Worker code only. D1 schema changes from this run stay applied —
      # keep migrations additive (or follow expand/migrate/contract).
      - name: Rollback Worker on smoke failure
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          npx wrangler rollback --yes --message "Automated rollback: smoke test failed after ${GITHUB_SHA}"
