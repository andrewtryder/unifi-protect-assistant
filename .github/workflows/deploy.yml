name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Apply all migrations to a fresh local D1 database
        run: npm run db:migrate:local

      - name: Populated-schema upgrade and foreign-key integrity
        run: npx vitest run tests/retention.integration.test.ts

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_BASE_URL: https://unifi-protect-assistant.mrcoffee.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Additive migrations only in the same release as Worker code that needs them.
      # For destructive schema changes, use expand → migrate → contract across releases.
      # Non-interactive CI skips the apply confirmation; a D1 backup is still captured by Cloudflare.
      - name: Apply D1 migrations (remote)
        id: migrate
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            WEBHOOK_SECRET
            BETTER_AUTH_SECRET
            BETTER_AUTH_API_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            ALLOWED_EMAILS
            HONEYBADGER_API_KEY
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}

      - name: Smoke test
        id: smoke
        run: bash scripts/smoke.sh

      # Rolls back Worker code only. D1 schema changes from this run stay applied —
      # keep migrations additive (or follow expand/migrate/contract).
      - name: Rollback Worker on smoke failure
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          npx wrangler rollback --yes --message "Automated rollback: smoke test failed after ${GITHUB_SHA}"

      - name: Distinguish migration vs deploy failure
        if: failure()
        run: |
          if [[ "${{ steps.migrate.outcome }}" != "success" ]]; then
            echo "::error::D1 migration failed — Worker was not deployed. Inspect wrangler d1 output; schema may be partially applied."
            exit 1
          fi
          if [[ "${{ steps.deploy.outcome }}" != "success" ]]; then
            echo "::error::Worker deploy failed after migrations applied. Schema may be ahead of Worker code."
            exit 1
          fi
          echo "::error::Post-deploy smoke or rollback step failed."
          exit 1
